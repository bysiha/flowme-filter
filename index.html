<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlowMe Filter · 사진 올리면 바로 FlowMe 색으로</title>
<meta name="description" content="공간 사진을 올리면 바로 FlowMe 색으로 바뀌어요. 사진은 어디에도 업로드되지 않아요.">
<meta property="og:title" content="FlowMe Filter">
<meta property="og:description" content="사진 올리면, 바로 FlowMe 색으로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{ --ink:#1a1816; --sub:#77716a; --line:#e7e2db; --bg:#faf8f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:Pretendard,-apple-system,system-ui,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); }
  .label{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--sub); }
  h1{ font-family:"Instrument Serif",serif; font-weight:400; font-size:46px; line-height:1.02; margin:10px 0 10px; letter-spacing:-.01em; }
  h1 em{ font-style:italic; }
  .lead{ font-size:15px; line-height:1.6; color:#4a4540; margin:0 0 22px; }
  .drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:220px; border:1px solid var(--line); border-radius:18px; background:#fff; cursor:pointer; text-align:center; }
  .drop b{ font-family:"Instrument Serif",serif; font-weight:400; font-size:28px; font-style:italic; }
  .drop span{ font-size:13px; color:var(--sub); }
  input[type=file]{ display:none; }
  .viewer{ position:relative; border-radius:14px; overflow:hidden; background:#ece8e2; touch-action:pan-y; user-select:none; -webkit-user-select:none; display:none; }
  .viewer canvas{ display:block; width:100%; height:auto; }
  .viewer .before{ position:absolute; inset:0; }
  .handle{ position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.95); transform:translateX(-1px); pointer-events:none; }
  .knob{ position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:rgba(255,255,255,.95); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink); }
  .tag{ position:absolute; top:12px; font-family:"Instrument Serif",serif; font-size:17px; color:#fff; pointer-events:none; }
  .tag.l{ left:14px } .tag.r{ right:14px }
  .busy{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(250,248,245,.55); font-size:14px; }
  .filters{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 6px; }
  .f{ border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 6px 9px; text-align:center; cursor:pointer; }
  .f .n{ font-family:"Instrument Serif",serif; font-size:22px; line-height:1.1; }
  .f .d{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .f.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .f.on .d{ color:#cfc8bf; }
  .row{ display:flex; align-items:center; gap:12px; margin:14px 2px 4px; font-size:13px; color:var(--sub); }
  .row input{ flex:1; accent-color:var(--ink); }
  .btns{ display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:16px; }
  button.b{ height:52px; border-radius:14px; border:1px solid var(--ink); background:#fff; color:var(--ink); font:500 15px Pretendard,sans-serif; cursor:pointer; }
  button.b.p{ background:var(--ink); color:#fff; }
  button.b:disabled{ opacity:.45; }
  .thumbs{ display:flex; gap:6px; overflow-x:auto; margin-top:12px; }
  .thumbs img{ width:54px; height:54px; object-fit:cover; border-radius:8px; opacity:.55; cursor:pointer; border:2px solid transparent; }
  .thumbs img.on{ opacity:1; border-color:var(--ink); }
  .msg{ font-size:13px; color:var(--sub); margin-top:10px; min-height:18px; text-align:center; }
  .note{ font-size:12.5px; line-height:1.6; color:var(--sub); margin-top:26px; padding-top:16px; border-top:1px solid var(--line); }
  .foot{ margin-top:18px; font-size:12.5px; color:var(--sub); }
  .foot a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
  #out{ display:none; width:100%; border-radius:12px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">FlowMe Filter</div>
  <h1>Made for <em>spaces.</em></h1>
  <p class="lead">공간 사진을 올리면 바로 FlowMe 색으로 바뀌어요.<br>고르고, 확인하고, 저장하면 끝이에요.</p>

  <label class="drop" id="drop" for="file">
    <b>Choose photos</b>
    <span>사진 고르기 · 여러 장도 돼요</span>
  </label>
  <input id="file" type="file" accept="image/*" multiple>

  <div class="viewer" id="viewer">
    <canvas id="cAfter"></canvas>
    <canvas id="cBefore" class="before"></canvas>
    <div class="tag l">Before</div><div class="tag r">After</div>
    <div class="handle" id="handle"><div class="knob">↔</div></div>
    <div class="busy" id="busy">보정 중…</div>
  </div>
  <div class="thumbs" id="thumbs"></div>

  <div id="controls" style="display:none">
    <div class="filters" id="filters"></div>
    <div class="row"><span>강도</span><input id="amt" type="range" min="0" max="100" value="100"><span id="amtv">100</span></div>
    <div class="btns">
      <button class="b" id="again">다른 사진</button>
      <button class="b p" id="save">저장하기</button>
    </div>
    <div class="msg" id="msg"></div>
    <img id="out" alt="보정된 사진">
  </div>

  <p class="note">사진은 어디에도 업로드되지 않아요. 이 화면 안에서만 바뀌고, 저장하면 내 휴대폰에만 남아요.<br>
  저장이 안 되면 아래 나타나는 사진을 길게 눌러 “사진 앱에 저장”을 눌러 주세요.</p>
  <div class="foot">by <a href="https://instagram.com/flowme_ritual" target="_blank" rel="noopener">@flowme_ritual</a> · 디자이너의 영감 저장소</div>
</div>

<script>
const LOOKS = {
  Clear:{ ko:'맑고 밝게', br:1.10, ct:1.02, sat:1.08, sep:0.00, scr:[40,36,32,0.06], soft:[255,215,170,0.08], sharp:0.35 },
  Warm: { ko:'밝고 따뜻하게', br:1.08, ct:1.04, sat:1.05, sep:0.05, scr:[40,36,32,0.05], soft:[255,215,170,0.12], sharp:0.30 },
  Dusk: { ko:'저녁 앰버', br:0.97, ct:1.08, sat:0.85, sep:0.12, scr:[30,40,48,0.06], soft:[255,170,110,0.18], sharp:0.20 },
};
const N = 33; const LUTS = {};
const cl = v => v<0?0:(v>1?1:v);
function softlight(b,s){ if(s<=0.5) return b-(1-2*s)*b*(1-b); const d = b<=0.25 ? ((16*b-12)*b+4)*b : Math.sqrt(b); return b+(2*s-1)*(d-b); }
function look(r,g,b,L){
  r=cl(r*L.br); g=cl(g*L.br); b=cl(b*L.br);
  r=cl((r-.5)*L.ct+.5); g=cl((g-.5)*L.ct+.5); b=cl((b-.5)*L.ct+.5);
  const s=L.sat;
  let nr=(0.213+0.787*s)*r+(0.715-0.715*s)*g+(0.072-0.072*s)*b;
  let ng=(0.213-0.213*s)*r+(0.715+0.285*s)*g+(0.072-0.072*s)*b;
  let nb=(0.213-0.213*s)*r+(0.715-0.715*s)*g+(0.072+0.928*s)*b;
  r=cl(nr); g=cl(ng); b=cl(nb);
  if(L.sep){ const a=L.sep; const sr=.393*r+.769*g+.189*b, sg=.349*r+.686*g+.168*b, sb=.272*r+.534*g+.131*b; r=cl(r+(sr-r)*a); g=cl(g+(sg-g)*a); b=cl(b+(sb-b)*a); }
  const [kr,kg,kb,ka]=L.scr; { const k=[kr/255,kg/255,kb/255]; r=r+ka*((1-(1-r)*(1-k[0]))-r); g=g+ka*((1-(1-g)*(1-k[1]))-g); b=b+ka*((1-(1-b)*(1-k[2]))-b); }
  const [wr,wg,wb,wa]=L.soft; { r=r+wa*(softlight(r,wr/255)-r); g=g+wa*(softlight(g,wg/255)-g); b=b+wa*(softlight(b,wb/255)-b); }
  return [cl(r),cl(g),cl(b)];
}
function lutFor(name){
  if(LUTS[name]) return LUTS[name];
  const L=LOOKS[name], t=new Float32Array(N*N*N*3); let i=0;
  for(let bi=0;bi<N;bi++) for(let gi=0;gi<N;gi++) for(let ri=0;ri<N;ri++){ const o=look(ri/(N-1),gi/(N-1),bi/(N-1),L); t[i++]=o[0]*255; t[i++]=o[1]*255; t[i++]=o[2]*255; }
  return LUTS[name]=t;
}
// process ImageData-like arrays: src -> dst, with sharpen + LUT + strength. chunked & async
async function processPixels(src, dst, w, h, name, amount, onProgress){
  const L=LOOKS[name], lut=lutFor(name), a=L.sharp, c=1+4*a, sc=(N-1)/255, NN=N*N;
  const rowsPer = 64;
  for(let y0=0;y0<h;y0+=rowsPer){
    const y1=Math.min(h,y0+rowsPer);
    for(let y=y0;y<y1;y++){
      const yu=(y>0?y-1:y)*w, yd=(y<h-1?y+1:y)*w, yc=y*w;
      for(let x=0;x<w;x++){
        const p=(yc+x)*4, pl=(yc+(x>0?x-1:x))*4, pr=(yc+(x<w-1?x+1:x))*4, pu=(yu+x)*4, pd=(yd+x)*4;
        let R=c*src[p]-a*(src[pl]+src[pr]+src[pu]+src[pd]);
        let G=c*src[p+1]-a*(src[pl+1]+src[pr+1]+src[pu+1]+src[pd+1]);
        let B=c*src[p+2]-a*(src[pl+2]+src[pr+2]+src[pu+2]+src[pd+2]);
        R=R<0?0:R>255?255:R; G=G<0?0:G>255?255:G; B=B<0?0:B>255?255:B;
        const fr=R*sc, fg=G*sc, fb=B*sc;
        let r0=fr|0, g0=fg|0, b0=fb|0; if(r0>N-2) r0=N-2; if(g0>N-2) g0=N-2; if(b0>N-2) b0=N-2;
        const dr=fr-r0, dg=fg-g0, db=fb-b0;
        const i000=((b0*NN)+(g0*N)+r0)*3, i100=i000+3, i010=i000+N*3, i110=i010+3, i001=i000+NN*3, i101=i001+3, i011=i001+N*3, i111=i011+3;
        for(let k=0;k<3;k++){
          const c00=lut[i000+k]+(lut[i100+k]-lut[i000+k])*dr, c10=lut[i010+k]+(lut[i110+k]-lut[i010+k])*dr;
          const c01=lut[i001+k]+(lut[i101+k]-lut[i001+k])*dr, c11=lut[i011+k]+(lut[i111+k]-lut[i011+k])*dr;
          const c0=c00+(c10-c00)*dg, c1=c01+(c11-c01)*dg, v=c0+(c1-c0)*db;
          dst[p+k]=src[p+k]+(v-src[p+k])*amount;
        }
        dst[p+3]=255;
      }
    }
    if(onProgress){ onProgress(y1/h); await new Promise(r=>setTimeout(r,0)); }
  }
}

// ---- UI ----
const $=id=>document.getElementById(id);
let files=[], cur=0, img=null, name='Clear', amount=1, split=0.5, readyFile=null, token=0;
const cA=$('cAfter'), cB=$('cBefore'), viewer=$('viewer');
const fwrap=$('filters');
for(const k of Object.keys(LOOKS)){ const d=document.createElement('div'); d.className='f'+(k===name?' on':''); d.dataset.k=k; d.innerHTML=`<div class="n">${k}</div><div class="d">${LOOKS[k].ko}</div>`; d.onclick=()=>{ name=k; [...fwrap.children].forEach(e=>e.classList.toggle('on',e.dataset.k===k)); renderPreview(); }; fwrap.appendChild(d); }
$('amt').oninput=e=>{ amount=e.target.value/100; $('amtv').textContent=e.target.value; renderPreview(); };
$('again').onclick=()=>$('file').click();
$('file').onchange=async e=>{ const fs=[...e.target.files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name)); if(!fs.length) return; files=fs; cur=0; buildThumbs(); await loadCurrent(); e.target.value=''; };

function buildThumbs(){ const t=$('thumbs'); t.innerHTML=''; if(files.length<2) return; files.forEach((f,i)=>{ const im=document.createElement('img'); im.src=URL.createObjectURL(f); im.className=i===cur?'on':''; im.onclick=async()=>{ cur=i; [...t.children].forEach((e,j)=>e.classList.toggle('on',j===i)); await loadCurrent(); }; t.appendChild(im); }); }

function loadImage(file){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('이 사진 형식은 열 수 없어요. JPG나 PNG로 다시 골라 주세요.')); im.src=URL.createObjectURL(file); }); }

async function loadCurrent(){
  $('msg').textContent=''; $('out').style.display='none'; readyFile=null; $('save').textContent=files.length>1?`저장하기 (${files.length}장)`:'저장하기';
  try{ img=await loadImage(files[cur]); }catch(err){ $('msg').textContent=err.message; return; }
  $('drop').style.display='none'; viewer.style.display='block'; $('controls').style.display='block';
  const long=Math.min(1400, Math.max(img.naturalWidth,img.naturalHeight)); const s=long/Math.max(img.naturalWidth,img.naturalHeight);
  const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
  for(const c of [cA,cB]){ c.width=w; c.height=h; }
  const bx=cB.getContext('2d'); bx.imageSmoothingQuality='high'; bx.drawImage(img,0,0,w,h);
  setSplit(split); renderPreview();
}
async function renderPreview(){
  if(!img) return; const my=++token; readyFile=null; $('out').style.display='none';
  $('save').textContent=files.length>1?`저장하기 (${files.length}장)`:'저장하기';
  const w=cB.width,h=cB.height; const src=cB.getContext('2d').getImageData(0,0,w,h); const dst=new ImageData(w,h);
  await processPixels(src.data,dst.data,w,h,name,amount,null);
  if(my!==token) return; cA.getContext('2d').putImageData(dst,0,0);
}
function setSplit(v){ split=Math.max(0,Math.min(1,v)); cB.style.clipPath=`inset(0 ${(1-split)*100}% 0 0)`; $('handle').style.left=(split*100)+'%'; }
let drag=false;
viewer.addEventListener('pointerdown',e=>{ drag=true; viewer.setPointerCapture(e.pointerId); move(e); });
viewer.addEventListener('pointermove',e=>{ if(drag) move(e); });
viewer.addEventListener('pointerup',()=>drag=false); viewer.addEventListener('pointercancel',()=>drag=false);
function move(e){ const r=viewer.getBoundingClientRect(); setSplit((e.clientX-r.left)/r.width); }

// full-res export (iOS Safari canvas limit ~16.7MP)
async function exportOne(file, onProg){
  const im = (file===files[cur] && img) ? img : await loadImage(file);
  let w=im.naturalWidth, h=im.naturalHeight; const MAX=16000000;
  if(w*h>MAX){ const s=Math.sqrt(MAX/(w*h)); w=Math.floor(w*s); h=Math.floor(h*s); }
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(im,0,0,w,h);
  const id=x.getImageData(0,0,w,h); const out=new Uint8ClampedArray(id.data.length);
  await processPixels(id.data,out,w,h,name,amount,onProg);
  id.data.set(out); x.putImageData(id,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));
  const base=(file.name||'photo').replace(/\.[^.]+$/,'');
  c.width=c.height=1;
  return new File([blob], `${base}_FlowMe_${name}.jpg`, {type:'image/jpeg'});
}
async function deliver(list){
  if(navigator.canShare && navigator.canShare({files:list})){
    try{ await navigator.share({files:list}); $('msg').textContent='저장 완료! 공유 창에서 “이미지 저장”을 눌렀다면 사진 앱에 있어요.'; return; }
    catch(err){ if(err.name==='AbortError'){ $('msg').textContent='저장을 취소했어요.'; return; } readyFile=list; $('save').textContent='준비됐어요 · 눌러서 저장'; $('msg').textContent='보정이 끝났어요. 버튼을 한 번 더 눌러 주세요.'; return; }
  }
  for(const f of list){ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r=>setTimeout(r,300)); }
  const o=$('out'); o.src=URL.createObjectURL(list[list.length-1]); o.style.display='block';
  $('msg').textContent='저장됐어요. 안 보이면 아래 사진을 길게 눌러 저장해 주세요.';
}
$('save').onclick=async()=>{
  if(readyFile){ const l=readyFile; readyFile=null; return deliver(l); }
  const btn=$('save'); btn.disabled=true; $('again').disabled=true; $('busy').style.display='flex';
  try{
    const list=[];
    for(let i=0;i<files.length;i++){ list.push(await exportOne(files[i], p=>{ $('busy').textContent=`보정 중… ${files.length>1?(i+1)+'/'+files.length+' · ':''}${Math.round(p*100)}%`; })); }
    $('busy').style.display='none'; btn.disabled=false; $('again').disabled=false;
    await deliver(list);
  }catch(err){ $('busy').style.display='none'; btn.disabled=false; $('again').disabled=false; $('msg').textContent='저장 중 문제가 생겼어요: '+err.message; }
};
</script>
</body>
</html>
